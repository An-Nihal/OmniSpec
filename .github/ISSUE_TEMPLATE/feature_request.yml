name: Feature request
description: Suggest a new feature or an improvement to OmniSpec.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please note OmniSpec's project principles:
        it works offline with no telemetry or network calls, it never fabricates sensor values,
        and it does not control hardware (fans, voltages, overclocking).

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like OmniSpec to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or tools you have tried.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mock-ups, or links.
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
